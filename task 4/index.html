<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram Mockup</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="phone">

            <div class="notch">
                <div class="camera"></div>
                <div class="speaker"></div>
            </div>
            <div class="screen">

                <div class="status-bar">

                    <div class="status-left">
                        <div class="dot"></div>
                        <div class="dot small"></div>
                    </div>

                    <div class="status-right">
                        <i class="fa-solid fa-signal"></i>
                        <i class="fa-solid fa-wifi"></i>
                        <i class="fa-solid fa-battery-full"></i>
                    </div>

                </div>

                <div class="header">

                    <div class="menu">
                        <i class="fa-solid fa-bars"></i>
                    </div>

                </div>

                <div class="profile">

                    <div class="avatar">

                        <div class="avatar-inner"></div>

                        <span class="plus">+</span>

                    </div>

                    <div class="profile-info">

                        <div class="line long"></div>

                        <div class="stats">

                            <div class="stat"></div>
                            <div class="stat"></div>
                            <div class="stat"></div>

                        </div>

                    </div>

                </div>

                <div class="bio">

                    <div class="bio-line w1"></div>
                    <div class="bio-line w2"></div>
                    <div class="bio-line w3"></div>

                </div>

                <div class="buttons">

                    <div class="btn"></div>
                    <div class="btn"></div>
                    <div class="btn"></div>

                </div>

                <div class="stories">

                    <div class="story add"> +</div>
                    <div class="story pink"></div>
                    <div class="story purple"></div>
                    <div class="story violet"></div>

                </div>

                <div class="grid-header">

                    <i class="fa-solid fa-table-cells"></i>
                    <i class="fa-regular fa-user"></i>

                </div>

                <div class="posts">

                    <div class="post"></div>
                    <div class="post"></div>
                    <div class="post"></div>

                    <div class="post"></div>
                    <div class="post"></div>
                    <div class="post"></div>

                </div>

                <div class="bottom-nav">

                    <i class="fa-solid fa-house"></i>
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-regular fa-square-plus"></i>
                    <i class="fa-regular fa-heart"></i>
                    <i class="fa-regular fa-user"></i>

                </div>

            </div>

        </div>

        <div class="phone">

            <div class="notch">
                <div class="camera"></div>
                <div class="speaker"></div>
            </div>

            <div class="screen">

                <div class="status-bar">

                    <div class="status-left">
                        <div class="dot"></div>
                        <div class="dot small"></div>
                    </div>

                    <div class="status-right">
                        <i class="fa-solid fa-signal"></i>
                        <i class="fa-solid fa-wifi"></i>
                        <i class="fa-solid fa-battery-full"></i>
                    </div>

                </div>

                <div class="feed-header">

                    <div class="logo-line"></div>

                    <div class="feed-icons">

                        <i class="fa-regular fa-heart"></i>
                        <i class="fa-regular fa-paper-plane"></i>

                    </div>

                </div>

                <div class="feed-stories">

                    <div class="feed-story">
                        <div class="ring">
                            <div class="inside"></div>
                        </div>
                    </div>
                    <div class="feed-story">
                        <div class="ring">
                            <div class="inside"></div>
                        </div>
                    </div>
                    <div class="feed-story">
                        <div class="ring">
                            <div class="inside"></div>
                        </div>
                    </div>
                    <div class="feed-story">
                        <div class="ring">
                            <div class="inside"></div>
                        </div>
                    </div>
                    <div class="feed-story">
                        <div class="ring">
                            <div class="inside"></div>
                        </div>
                    </div>

                </div>


                <div class="post-header">

                    <div class="mini-avatar"></div>
                    <div class="mini-lines">
                        <div class="mini-line"></div>
                        <div class="mini-small"></div>
                    </div>
                    <i class="fa-solid fa-ellipsis-vertical"></i>

                </div>

                <div class="feed-photo"></div>

                <div class="feed-actions">

                    <div class="left-icons">

                        <i class="fa-regular fa-heart"></i>
                        <i class="fa-regular fa-comment"></i>
                        <i class="fa-regular fa-paper-plane"></i>

                    </div>

                    <i class="fa-regular fa-bookmark"></i>

                </div>

                <div class="feed-text">

                    <div class="text-line w90"></div>
                    <div class="text-line w75"></div>
                    <div class="text-line w60"></div>

                </div>

                <div class="bottom-nav">

                    <i class="fa-solid fa-house"></i>
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-regular fa-square-plus"></i>
                    <i class="fa-regular fa-heart"></i>
                    <i class="fa-regular fa-user"></i>

                </div>

            </div>

        </div>


        <div class="phone">

            <div class="notch">
                <div class="camera"></div>
                <div class="speaker"></div>
            </div>

            <div class="screen">

    <div class="status-bar">

        <div class="status-left">
            <div class="dot"></div>
            <div class="dot small"></div>
        </div>

        <div class="status-right">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi"></i>
            <i class="fa-solid fa-battery-full"></i>
        </div>

    </div>

    <div class="explore-search">

        <i class="fa-solid fa-magnifying-glass"></i>
        <div class="search-placeholder"></div>

    </div>

    <div class="explore-grid">

        <div class="box b1"></div>
        <div class="box b2"></div>
        <div class="box b3"></div>

        <div class="box b4"></div>
        <div class="box b5"></div>
        <div class="box b6"></div>

        <div class="box b7"></div>
        <div class="box b8"></div>
        <div class="box b9"></div>

    </div>

    <div class="bottom-nav">

        <i class="fa-solid fa-house"></i>
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-regular fa-square-plus"></i>
        <i class="fa-regular fa-heart"></i>
        <i class="fa-regular fa-user"></i>

    </div>

</div>

        </div>

    </div>

</body>

</html>
